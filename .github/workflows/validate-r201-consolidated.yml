name: Validate consolidated DeskSpace bundle (no release)
on:
  push:
    branches:
      - feat/r201-consolidated-roadmap-bundle
  workflow_dispatch:

concurrency:
  group: deskspace-r201-consolidated-validation
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout feature implementation
        uses: actions/checkout@v4

      - name: Install Windows .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Retrieve last verified v1.5.1093 canonical app sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force '.r201/received' | Out-Null
          gh run download 41002762293 -R surajTech-22/Desk-space -n DeskSpace-R195-Canonical-WPF-Source -D '.r201/received'
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch verified R200 source snapshot'}
          $a=@(Get-ChildItem '.r201/received' -Recurse -File -Filter DeskSpace-Canonical-Source.zip)
          $hash=@(Get-ChildItem '.r201/received' -Recurse -File -Filter DeskSpace-Canonical-Source.sha256.txt)
          if($a.Count -ne 1 -or $hash.Count -ne 1){throw 'Canonical source ZIP or SHA256 receipt missing'}
          $expected=((Get-Content -Raw $hash[0].FullName).Trim() -split '\s+')[0]
          $actual=(Get-FileHash $a[0].FullName -Algorithm SHA256).Hash
          if(!$actual.Equals($expected,[StringComparison]::OrdinalIgnoreCase)){throw 'Source ZIP hash mismatch'}
          Expand-Archive -LiteralPath $a[0].FullName -DestinationPath '.r201/unpacked'
          if(!(Test-Path '.r201/unpacked/DeskSpace/DeskSpace.csproj')){throw 'Verified WPF project missing from source ZIP'}
          New-Item -ItemType Directory 'DeskSpace_Windows_R1' -Force | Out-Null
          Move-Item '.r201/unpacked/DeskSpace' 'DeskSpace_Windows_R1/DeskSpace'
          Write-Host 'R201-R202 PASS: verified 1.5.1093 canonical sources staged without touching releases.'

      - name: Apply profile and vault changes, strictly check patch anchors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r201/apply-r201.ps1
          ./r202/apply-r202.ps1
          ./r203/apply-r203.ps1
          ./r205/apply-r205.ps1
          ./r206/apply-r206.ps1
          ./r207/apply-r207.ps1
          ./r208/apply-r208.ps1
          ./r209/apply-r209.ps1
          ./r210/apply-r210.ps1
          ./r211/apply-r211.ps1
          ./r212/apply-r212.ps1
          ./r214/apply-r214.ps1
          ./r215/apply-r215.ps1
          ./r216/apply-r216.ps1
          ./r217/apply-r217.ps1
          ./r218/apply-r218.ps1
          ./r219/apply-r219.ps1
          ./r222/apply-r222.ps1
          ./r224/apply-r224.ps1
          ./r225/apply-r225.ps1
          ./r201/apply-tests-r201-r202.ps1
          ./r203/apply-tests-r203.ps1
          ./r205/apply-tests-r205.ps1
          ./r206/apply-tests-r206.ps1
          ./r207/apply-tests-r207.ps1
          ./r208/apply-tests-r208.ps1
          ./r209/apply-tests-r209.ps1
          ./r210/apply-tests-r210.ps1
          ./r211/apply-tests-r211.ps1
          ./r212/apply-tests-r212.ps1
          ./r214/apply-tests-r214.ps1
          ./r215/apply-tests-r215.ps1
          ./r216/apply-tests-r216.ps1
          ./r217/apply-tests-r217.ps1
          ./r218/apply-tests-r218.ps1
          ./r219/apply-tests-r219.ps1
          ./r222/apply-tests-r222.ps1
          ./r224/apply-tests-r224.ps1
          ./r225/apply-tests-r225.ps1
          ./r201/test-r201-r202.ps1
          ./r203/test-r203.ps1
          ./r205/test-r205.ps1
          ./r206/test-r206.ps1
          ./r207/test-r207.ps1
          ./r208/test-r208.ps1
          ./r209/test-r209.ps1
          ./r210/test-r210.ps1
          ./r211/test-r211.ps1
          ./r212/test-r212.ps1
          ./r214/test-r214.ps1
          ./r215/test-r215.ps1
          ./r216/test-r216.ps1
          ./r217/test-r217.ps1
          ./r218/test-r218.ps1
          ./r219/test-r219.ps1
          ./r222/test-r222.ps1
          ./r224/test-r224.ps1
          ./r225/test-r225.ps1

      - name: Validate legacy updater checksum compatibility on synthetic installer
        shell: pwsh
        run: |
          ./r220/test-r220.ps1

      - name: Assert the single-release gate blocks unverified remaining work
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $blocked=$false
          try { ./r204/require-consolidated-ready.ps1 }
          catch {
            if($_.Exception.Message -like '*SINGLE-RELEASE GATE*') {
              $blocked=$true
              Write-Host 'R204 PASS: partial implementation explicitly blocked from publication.'
            } else { throw }
          }
          if(!$blocked){throw 'R204 regression: unverified roadmap would be publishable'}

      - name: Verify full-install rollback using synthetic files only (R213)
        shell: pwsh
        run: |
          ./r213/test-r213.ps1

      - name: Compile amended WPF application from canonical source
        shell: pwsh
        run: |
          dotnet build 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj' -c Release --nologo -p:ContinuousIntegrationBuild=true
          if($LASTEXITCODE -ne 0){throw 'Consolidated WPF compilation failed'}

      - name: Run isolated native WPF R201-R225 acceptance (no release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory '.r201/evidence' -Force | Out-Null
          dotnet run --project 'r36/UiSmoke/UiSmoke.csproj' -c Release -- '.r201/evidence' '--r201-only'
          if($LASTEXITCODE -ne 0){throw 'Native WPF tests failed'}

      - name: R221 freeze verified consolidated patched WPF sources
        shell: pwsh
        run: |
          ./r221/package-single-source.ps1
          ./r221/test-r221.ps1

      - name: R221 independently rebuild unpacked source with no patch scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='r221/output/DeskSpace-R221-Source.zip'
          $target=Join-Path $env:RUNNER_TEMP ('deskspace-r221-rebuild-'+[guid]::NewGuid().ToString('N'))
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory($source,$target,$false)
            dotnet build (Join-Path $target 'DeskSpace/DeskSpace.csproj') -c Release --nologo -p:ContinuousIntegrationBuild=true
            if($LASTEXITCODE -ne 0){throw 'R221 independent canonical source build failed'}
          } finally {
            if(Test-Path $target){Remove-Item -LiteralPath $target -Recurse -Force}
          }

      - name: Upload verified consolidated source (NON-RELEASE build evidence)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskSpace-R221-Consolidated-Verified-Source
          path: |
            r221/output/DeskSpace-R221-Source.zip
            r221/output/DeskSpace-R221-Source.sha256.txt
            r221/output/DeskSpace-R221-Source.manifest.json
          retention-days: 28

      - name: Upload validation evidence only (NO release assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeskSpace-R201-R202-Validation-Only
          path: |
            .r201/evidence/*.png
          if-no-files-found: ignore
          retention-days: 10
