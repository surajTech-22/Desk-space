name: DeskSpace R369 Chronograph Stopwatch Native Windows Tests
on:
  push:
    branches: [feat/r369-chronograph-stopwatch]
    paths:
      - src/DeskSpace/DeskSpaceStopwatchV369.cs
      - src/DeskSpace/WidgetHost.cs
      - r369/**
      - .github/workflows/test-r369-stopwatch-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stopwatch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build original checked-in WPF DeskSpace with stopwatch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/DeskSpace/DeskSpace.csproj -c Release --nologo
          if($LASTEXITCODE -ne 0){throw 'R369 checked-in DeskSpace WPF compile failed'}
      - name: Test stopwatch circular controls and elapsed-time behavior
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet run --project r369/Tests/SourceStopwatchTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'R369 stopwatch Start Pause Lap Reset regression failed'}
