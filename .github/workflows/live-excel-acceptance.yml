name: DeskSpace Real Excel Acceptance (release gate)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-excel:
    # Only an Excel-installed Windows runner can satisfy live COM acceptance.
    # GitHub-hosted Windows runners do not include desktop Microsoft Excel.
    runs-on: [self-hosted, Windows, X64, excel-installed]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify desktop Excel COM availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Type]::GetTypeFromProgID('Excel.Application') -eq $null) {
            throw 'BLOCKED: Microsoft Excel COM unavailable. This is NOT a passing acceptance test.'
          }
      - name: Build tested DeskSpace source without publishing
        shell: pwsh
        run: |
          ./r106/apply-r106.ps1
          ./r109/apply-r109.ps1
          ./r109/test-r109.ps1
          ./r110/test-r110.ps1
          dotnet publish DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $env:RUNNER_TEMP/deskspace-app
          dotnet build r111/LiveExcelAcceptance/LiveExcelAcceptance.csproj -c Release
      - name: Execute real Office COM tests with disposable workbooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = Join-Path $env:RUNNER_TEMP 'deskspace-app/DeskSpace.dll'
          if (!(Test-Path -LiteralPath $assembly)) { throw 'Missing DeskSpace.dll' }
          dotnet run --project r111/LiveExcelAcceptance/LiveExcelAcceptance.csproj -c Release --no-build -- $assembly
