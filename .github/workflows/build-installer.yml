      - name: Assign monotonic build version to installer and app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $number = [int]$env:GITHUB_RUN_NUMBER
          if ($number -le 0) { throw 'Cannot determine new release build number' }
          $version = "1.5.$number"
          if([version]$version -le [version]'1.4.29412'){throw 'Legacy manual version would block upgrade'}
          $iss = 'installer/DeskSpace.iss'
          $inno = [IO.File]::ReadAllText($iss)
          $from = '#define AppVersion "1.4.0"'
          if (!$inno.Contains($from)) { throw 'Incorrect pre-build installer version' }
          $inno = $inno.Replace($from,'#define AppVersion "' + $version + '"')
          [IO.File]::WriteAllText($iss,$inno,[Text.UTF8Encoding]::new($false))
          $cs = 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs'
          $code = [IO.File]::ReadAllText($cs)
          $before = 'private static readonly Version InstalledVersion = new(1, 4, 0);'
          if (!$code.Contains($before)) { throw 'Updater version anchor missing' }
          $code = $code.Replace($before, 'private static readonly Version InstalledVersion = new(1, 5, ' + $number + ');')
          [IO.File]::WriteAllText($cs,$code,[Text.UTF8Encoding]::new($false))
          Write-Host "Release version assigned: $version"

      - name: Verify upgrade version and automatic updater linkage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $versionLine=Select-String -Path 'installer/DeskSpace.iss' -Pattern '^#define AppVersion "([^"]+)"$' | Select-Object -First 1
          if(!$versionLine){throw 'Installer version missing'}
          $v=[version]$versionLine.Matches[0].Groups[1].Value
          if($v -le [version]'1.4.29412'){throw 'Version must exceed installed manual updater version'}
          $code=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs' -Raw
          $expected='InstalledVersion = new('+$v.Major+', '+$v.Minor+', '+$v.Build+');'
          if(!$code.Contains($expected)){throw 'App/installer version mismatch'}
          if(!$code.Contains('DeskSpacePublicUpdaterV44.StartAutomaticChecks(host)')){
            throw 'Background stable updater linkage is missing'
          }
          Write-Host ('Manual to automatic upgrade gate PASS: '+$v)

