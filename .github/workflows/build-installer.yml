            'if(typed)AddRow()',
            'File.Replace(temp,CollectionsPath',
            'information-items-v22.json','VaultId',
            'MaskRevealed()'))
          {if(!$child.Contains($key)){throw "R32 lost drag / editor / data safeguard: $key"}}
          if(!$behavior.Contains('InputWindows.Add(hwnd)') -or
             !$behavior.Contains('style &= ~WS_EX_NOACTIVATE'))
          {throw 'R32 cannot safely enable native textbox keyboard activation'}
          $source=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceInformationV31.cs' -Raw
          if(!$source.Contains('arcCanvas.PreviewMouseLeftButtonDown+=OnArcPointerDown'))
          {throw 'R32 ordinary click selection was lost'}
          # Screen pixel to popup-DIP roundtrip: parent capture and popup
          # use the same PointToScreen/PointFromScreen coordinate space.
          foreach($count in @(0,1,2,4,12))
          {
            $num=[Math]::Min(4,$count)+1
            $half=if($num -eq 1){17}else{[Math]::Min(57,12*$num)}
            $start=-90-$half
            for($i=0;$i -lt $num;$i++)
            {
              $middle=$start+(($i+.5)*$half*2/$num)
              $r=$middle*[Math]::PI/180
              $px=244+233.5*[Math]::Cos($r)
              $py=306+233.5*[Math]::Sin($r)
              if($px -lt 0 -or $px -gt 488 -or $py -lt 0 -or $py -gt 222)
              {throw "R32 drag landing off hit-zone canvas count=$count sector=$i"}
            }
          }
          Write-Host 'R32 drag, click, empty state, textbox focus, dynamic rows and data gates verified.'

      - name: Assign monotonic build version to installer and app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $number = [int]$env:GITHUB_RUN_NUMBER
          if ($number -le 0) { throw 'Cannot determine new release build number' }
          $version = "1.4.$number"
          $iss = 'installer/DeskSpace.iss'
          $inno = [IO.File]::ReadAllText($iss)
          $from = '#define AppVersion "1.4.0"'
          if (!$inno.Contains($from)) { throw 'Incorrect pre-build installer version' }
          $inno = $inno.Replace($from,'#define AppVersion "' + $version + '"')
          [IO.File]::WriteAllText($iss,$inno,[Text.UTF8Encoding]::new($false))
          $cs = 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs'
          $code = [IO.File]::ReadAllText($cs)
          $before = 'private static readonly Version InstalledVersion = new(1, 4, 0);'
          if (!$code.Contains($before)) { throw 'Updater version anchor missing' }
          $code = $code.Replace($before, 'private static readonly Version InstalledVersion = new(1, 4, ' + $number + ');')
          [IO.File]::WriteAllText($cs,$code,[Text.UTF8Encoding]::new($false))
          Write-Host "Release version assigned: $version"

      - name: Verify official GitHub CLI is available for bundled updater
        shell: pwsh
        run: |
          $cli=Get-Command gh.exe -ErrorAction SilentlyContinue
          if (!$cli) {
            choco install gh --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI installation failed' }
            $env:PATH += ';C:\Program Files\GitHub CLI'
          }
          $cli=Get-Command gh.exe -ErrorAction SilentlyContinue
          if (!$cli) { throw 'The updater needs the official gh.exe on the Windows build runner' }
          gh --version

      - name: Install .NET 8 SDK on GitHub build runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup on GitHub build runner
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }

      - name: Compile, test and package self-contained app
        shell: pwsh
        run: ./BUILD_DESKSPACE_SETUP.ps1

      - name: Confirm installer and checksum exist
        shell: pwsh
        run: |
          if (!(Test-Path 'release/DeskSpace_Setup.exe')) { throw 'Installer not created' }
          if (!(Test-Path 'release/DeskSpace_Setup.sha256.txt')) { throw 'Checksum missing' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'release/DeskSpace_Setup.exe'))
          if ($bytes.Length -lt 5000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows installer' }

      - name: Upload real Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskSpace-Windows-Installer
          path: |
            release/DeskSpace_Setup.exe
            release/DeskSpace_Setup.sha256.txt
          if-no-files-found: error


      - name: Publish successful version to private GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'installer/DeskSpace.iss' -Pattern '^#define AppVersion "([^"]+)"$' | Select-Object -First 1
          if (!$match) { throw 'Cannot read compiled DeskSpace release version' }
          $tag = 'v' + $match.Matches[0].Groups[1].Value
          $repo = 'surajTech-22/Desk-space'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to replace existing tagged release $tag" }
          gh release create $tag 'release/DeskSpace_Setup.exe' 'release/DeskSpace_Setup.sha256.txt' --repo $repo --target $env:GITHUB_SHA --title 'DeskSpace R5 automatic updater' --notes 'Private verified Windows release. The DeskSpace updater authenticates using the official GitHub CLI.'
          if ($LASTEXITCODE -ne 0) { throw 'Automatic update release publishing failed' }
          $status = "$tag|$env:GITHUB_SHA|release-published"
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $receiptPath = "repos/$repo/contents/releases/latest-build.txt"
          # The file already exists after the first release. GitHub's contents API
          # requires its CURRENT blob SHA for every subsequent update.
          $oldSha = gh api $receiptPath --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($oldSha)) { throw 'Cannot verify current release receipt SHA' }
          $body = @{
            message='Record verified DeskSpace automatic-release publication'
            content=$base64
            branch='main'
            sha=$oldSha.Trim()
          }
          $request = $body | ConvertTo-Json -Compress
          $receiptFile = Join-Path $env:RUNNER_TEMP 'deskspace-release-receipt.json'
          [IO.File]::WriteAllText($receiptFile,$request,[Text.UTF8Encoding]::new($false))
          gh api --method PUT $receiptPath --input $receiptFile
          if ($LASTEXITCODE -ne 0) { throw 'Release published, but publication receipt could not be saved' }
