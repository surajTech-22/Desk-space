          {throw 'R34 full calendar new-event action unavailable'}
          # Child paging must not need a mouse click and must stop at edges.
          foreach($number in @(0,1,2,4,6,12))
          {
            $page=0
            $count=0
            while($page+4 -lt $number){$page++;$count++;if($count -gt 100){throw 'R34 infinite right paging'}}
            if($page -ne [Math]::Max(0,$number-4)){throw "R34 right paging mismatch for $number saved"}
