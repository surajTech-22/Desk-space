name: DeskSpace Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-installer.yml"
      - "assets/source.part*.txt"
      - "r2/**"
      - "r3/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-installer.yml"
      - "assets/source.part*.txt"
      - "r2/**"
      - "r3/**"
      - "BUILD_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout DeskSpace
        uses: actions/checkout@v4

      - name: Reconstruct and verify original DeskSpace R1 sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = for ($i=1; $i -le 4; $i++) {
            $p = "assets/source.part$i.txt"
            if (!(Test-Path -LiteralPath $p)) { throw "Missing source part: $p" }
            (Get-Content -LiteralPath $p -Raw).Trim()
          }
          $blob = [Convert]::FromBase64String($parts -join '')
          $archive = Join-Path (Get-Location).Path 'assets/deskspace_source.tar.xz'
          [System.IO.File]::WriteAllBytes($archive, $blob)
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'de852a020013de604cdb9b206e38f4ec1359e7f2169bc898e9ca60299a0249a3') {
            throw "Source SHA256 mismatch: $sha"
          }
          tar -xJf $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          if (!(Test-Path 'BUILD_DESKSPACE_SETUP.ps1')) { throw 'Build script missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj')) { throw 'App project missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace.Tests/DeskSpace.Tests.csproj')) { throw 'Test project missing' }

      - name: Apply R2 independently editable desktop widget fix
        shell: pwsh
        run: |
          Copy-Item -LiteralPath r2/FloatingDashboardWindow.cs -Destination DeskSpace_Windows_R1/DeskSpace/FloatingDashboardWindow.cs
          ./r2/apply-r2.ps1
          if (!(Select-String -Path DeskSpace_Windows_R1/DeskSpace/MainWindow.xaml.cs -Pattern 'ShowFloatingWidget' -Quiet)) { throw 'Floating widget not wired' }
          if (!(Select-String -Path installer/DeskSpace.iss -Pattern '#define AppVersion "1.1.0"' -Quiet -SimpleMatch)) { throw 'R2 installer version not applied' }

      - name: Reconstruct and apply DeskSpace R3 live donut sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = for ($i=1; $i -le 3; $i++) {
            $path = "r3/source.part$i.txt"
            if (!(Test-Path -LiteralPath $path)) { throw "R3 missing source part: $path" }
            (Get-Content -LiteralPath $path -Raw).Trim()
          }
          $archive = Join-Path (Get-Location).Path 'r3/source-overlay.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($parts -join ''))
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fa18ac004316133551183e53f31d670d7a32f12a3d72207dc748d09db049898e') { throw "R3 source checksum mismatch: $hash" }
          tar -xJf $archive
          if ($LASTEXITCODE -ne 0) { throw 'R3 source extraction failed' }
          ./r3/apply-r3.ps1
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs')) { throw 'Widget host missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/UniversalSearch.cs')) { throw 'Universal Search missing' }
          if (!(Select-String -Path installer/DeskSpace.iss -Pattern '#define AppVersion "1.2.0"' -Quiet -SimpleMatch)) { throw 'R3 version missing' }

      - name: Install .NET 8 SDK on GitHub build runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup on GitHub build runner
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }

      - name: Compile, test and package self-contained app
        shell: pwsh
        run: ./BUILD_DESKSPACE_SETUP.ps1

      - name: Confirm installer and checksum exist
        shell: pwsh
        run: |
          if (!(Test-Path 'release/DeskSpace_Setup.exe')) { throw 'Installer not created' }
          if (!(Test-Path 'release/DeskSpace_Setup.sha256.txt')) { throw 'Checksum missing' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'release/DeskSpace_Setup.exe'))
          if ($bytes.Length -lt 5000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows installer' }

      - name: Upload real Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskSpace-Windows-Installer
          path: |
            release/DeskSpace_Setup.exe
            release/DeskSpace_Setup.sha256.txt
          if-no-files-found: error
