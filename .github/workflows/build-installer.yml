name: DeskSpace Windows Installer

# Public repository: build R42 on branch updates and allow manual reruns.
on:
  workflow_dispatch:
  push:
    branches:
      - r42-excel-mapping-editor

permissions:
  contents: write

# Public runners build independently by source SHA. A canceled Windows job
# can remain in GitHub's teardown state and must not block new safety fixes.
# Only the CURRENT branch head is allowed to publish a stable release.
concurrency:
  group: deskspace-installer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Draft PRs consume no Windows runner minutes. The ready-for-review
    # transition deliberately starts the release-candidate verification.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DeskSpace
        uses: actions/checkout@v4

      - name: Reconstruct and verify original DeskSpace R1 sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = for ($i=1; $i -le 4; $i++) {
            $p = "assets/source.part$i.txt"
            if (!(Test-Path -LiteralPath $p)) { throw "Missing source part: $p" }
            (Get-Content -LiteralPath $p -Raw).Trim()
          }
          $blob = [Convert]::FromBase64String($parts -join '')
          $archive = Join-Path (Get-Location).Path 'assets/deskspace_source.tar.xz'
          [System.IO.File]::WriteAllBytes($archive, $blob)
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'de852a020013de604cdb9b206e38f4ec1359e7f2169bc898e9ca60299a0249a3') {
            throw "Source SHA256 mismatch: $sha"
          }
          tar -xJf $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          if (!(Test-Path 'BUILD_DESKSPACE_SETUP.ps1')) { throw 'Build script missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj')) { throw 'App project missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace.Tests/DeskSpace.Tests.csproj')) { throw 'Test project missing' }

      - name: Apply R2 independently editable desktop widget fix
        shell: pwsh
        run: |
          Copy-Item -LiteralPath r2/FloatingDashboardWindow.cs -Destination DeskSpace_Windows_R1/DeskSpace/FloatingDashboardWindow.cs
          ./r2/apply-r2.ps1
          if (!(Select-String -Path DeskSpace_Windows_R1/DeskSpace/MainWindow.xaml.cs -Pattern 'ShowFloatingWidget' -Quiet)) { throw 'Floating widget not wired' }
          if (!(Select-String -Path installer/DeskSpace.iss -Pattern '#define AppVersion "1.1.0"' -Quiet -SimpleMatch)) { throw 'R2 installer version not applied' }

      - name: Reconstruct and apply DeskSpace R3 live donut sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = for ($i=1; $i -le 3; $i++) {
            $path = "r3/source.part$i.txt"
            if (!(Test-Path -LiteralPath $path)) { throw "R3 missing source part: $path" }
            (Get-Content -LiteralPath $path -Raw).Trim()
          }
          $archive = Join-Path (Get-Location).Path 'r3/source-overlay.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($parts -join ''))
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fa18ac004316133551183e53f31d670d7a32f12a3d72207dc748d09db049898e') { throw "R3 source checksum mismatch: $hash" }
          tar -xJf $archive
          if ($LASTEXITCODE -ne 0) { throw 'R3 source extraction failed' }
          ./r3/apply-r3.ps1
          ./r3/fix-search-iterator.ps1
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs')) { throw 'Widget host missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/UniversalSearch.cs')) { throw 'Universal Search missing' }
          if (!(Select-String -Path installer/DeskSpace.iss -Pattern '#define AppVersion "1.2.0"' -Quiet -SimpleMatch)) { throw 'R3 version missing' }

      - name: Apply DeskSpace R4 compact hold-to-open and outside-ring drag gesture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = for ($i=1; $i -le 2; $i++) {
            $source = "r4/gesture.part$i.txt"
            if (!(Test-Path -LiteralPath $source)) { throw "R4 source part missing: $source" }
            (Get-Content -LiteralPath $source -Raw).Trim()
          }
          $archive = Join-Path (Get-Location).Path 'r4/widget-host-r4.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($parts -join ''))
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'be55889700e48e5f91dbe7847f8a29de8f68fcf25d5fbcd7b8d07c686cc95eba') {
            throw "R4 source integrity mismatch: $actual"
          }
          tar -xJf $archive
          if ($LASTEXITCODE -ne 0) { throw 'R4 extraction failed' }
          if (!(Test-Path 'r4/WidgetHost.cs')) { throw 'New widget host missing' }
          Copy-Item -LiteralPath 'r4/WidgetHost.cs' -Destination 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Force
          $hostSource = Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach ($requirement in @('CompactDiameter = 116','TimeSpan.FromMilliseconds(230)',
            'private void OnGestureMove','private int SectorAt','ClickSegment(Segments[selection])',
            'Leaving the outermost circle means MOVE WIDGET, never RUN ACTION.')) {
            if (!$hostSource.Contains($requirement)) { throw "R4 behavior gate missing: $requirement" }
          }
          $iss = 'installer/DeskSpace.iss'
          $setup = [IO.File]::ReadAllText($iss)
          if (!$setup.Contains('#define AppVersion "1.2.0"')) { throw 'Previous installer version unexpected' }
          $setup = $setup.Replace('#define AppVersion "1.2.0"','#define AppVersion "1.3.0"')
          $setup = $setup.Replace('AppVerName=DeskSpace R3','AppVerName=DeskSpace R4')
          [IO.File]::WriteAllText($iss,$setup,[Text.UTF8Encoding]::new($false))
          Write-Host 'R4 compact widget, ring selection and outer-ring drag behavior installed.'

      - name: Add R5 automatic private GitHub update service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw=(Get-Content -LiteralPath r5/overlay.b64.txt -Raw).Trim()
          $destination = 'r5/overlay.tar.xz'
          [IO.File]::WriteAllBytes($destination,[Convert]::FromBase64String($raw))
          $expected='d792cf07774d1d653ff57c8df738e4429629be782e02c232b99baca823eab7c9'
          $actual=(Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "R5 updater source checksum mismatch"}
          tar -xJf $destination -C r5
          if($LASTEXITCODE -ne 0){throw "R5 updater extraction failure"}
          ./r5/apply-r5.ps1
          if(!(Select-String -Path DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs -Pattern 'DeskSpaceUpdater.StartAutomaticChecks' -Quiet)){throw 'R5 updater timer not wired'}
          if(!(Select-String -Path installer/DeskSpace.iss -Pattern '#define AppVersion "1.4.0"' -SimpleMatch -Quiet)){throw 'R5 version missing'}

      - name: Apply R6 post-authentication update retry and diagnostics
        shell: pwsh
        run: |
          ./r6/apply-r6.ps1
          $updater = Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs' -Raw
          if (!$updater.Contains('TimeSpan.FromMinutes(5)')) { throw 'R6 automatic sign-in retry missing' }
          if (!$updater.Contains('update-status.log')) { throw 'R6 diagnostics missing' }
          if (!(Select-String -Path 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Pattern 'Check for updates' -SimpleMatch -Quiet)) { throw 'Widget update action missing' }
          $iss = 'installer/DeskSpace.iss'
          $setup = [IO.File]::ReadAllText($iss)
          if (!$setup.Contains('AppVerName=DeskSpace R5')) { throw 'R6 installer naming anchor missing' }
          $setup = $setup.Replace('AppVerName=DeskSpace R5','AppVerName=DeskSpace R6')
          [IO.File]::WriteAllText($iss,$setup,[Text.UTF8Encoding]::new($false))

      - name: Apply R7 unattended widget updates and supervised restart
        shell: pwsh
        run: |
          ./r7/apply-r7.ps1
          $updater = Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs' -Raw
          if ($updater.Contains('timer.Interval = TimeSpan.FromHours(2)')) { throw 'R7 must check every five minutes' }
          if (!$updater.Contains('Verified installer handed to independent supervisor')) { throw 'R7 installation handoff is missing' }
          if (!(Select-String -Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj' -Pattern 'EmbeddedResource Include="DeskSpaceUpdateSupervisor.ps1"' -SimpleMatch -Quiet)) { throw 'R7 supervisor is not bundled as a resource' }
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('r7/DeskSpaceUpdateSupervisor.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('R7 update supervisor has invalid PowerShell syntax: ' + ($parseErrors -join '; ')) }
          $supervisorSource = Get-Content 'r7/DeskSpaceUpdateSupervisor.ps1' -Raw
          foreach ($gate in @('Wait-Process', 'Start-Process -FilePath $Installer', 'Start-Process -FilePath $TargetExe', 'restoreMainWindow')) {
            if (!$supervisorSource.Contains($gate)) { throw "R7 unattended update supervisor is missing $gate" }
          }

      - name: Apply R8 version UI, live weather, branded icon and donut interaction fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./r8/apply-r8.ps1
          ./r8/create-logo.ps1
          $widget = Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach ($gate in @('DeskSpaceWindowBehavior.Apply', 'DeskSpaceWeather.RefreshAsync', 'ClockWithWeather()', 'MouseLeave +=', 'About / Version')) {
            if (!$widget.Contains($gate)) { throw "R8 widget check failed: $gate" }
          }
          if ($widget.Contains('btn.Click += (_,_)=> ClickSegment')) { throw 'R8 must not open modules from invisible buttons' }
          $native = Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceWindowBehavior.cs' -Raw
          if (!$native.Contains('WS_EX_NOACTIVATE') -or !$native.Contains('WS_EX_TOOLWINDOW')) { throw 'R8 Alt+Tab/focus exclusion missing' }
          $project = Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj' -Raw
          if (!$project.Contains('<ApplicationIcon>DeskSpace.ico</ApplicationIcon>')) { throw 'R8 application icon missing' }
          $version = Get-Content 'DeskSpace_Windows_R1/DeskSpace/MainWindow.xaml' -Raw
          if (!$version.Contains('VersionButton')) { throw 'R8 version control missing' }
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.ico')) { throw 'R8 logo generation failed' }

      - name: Apply and verify R9 widget, updater and module navigation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r9/apply-r9-widget.ps1
          ./r9/apply-r9-updater.ps1
          ./r9/apply-r9-main.ps1
          $widget = Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach($required in @('PreviewMouseRightButtonUp', 'IsNearScreenEdge()', 'DockToEdge(manual: true)', 'DeskSpaceUpdateProgress.Changed', 'AddWeatherHalo()', 'SegmentIcons')) {
            if(!$widget.Contains($required)){throw "R9 widget gate failed: $required"}
          }
          foreach($prohibited in @('var change=new Button { Content="◉"', 'var expand=new Button { Content="⤢"', 'var collapse = new Button { Content = "⌄"', 'var hide=new Button { Content="–"')) {
            if($widget.Contains($prohibited)){throw "R9 leftover button: $prohibited"}
          }
          $xml = [xml](Get-Content 'DeskSpace_Windows_R1/DeskSpace/MainWindow.xaml' -Raw)
          $version = Get-Content 'DeskSpace_Windows_R1/DeskSpace/MainWindow.xaml.cs' -Raw
          if (!$version.Contains('ModuleNavigate_Click') -or !$version.Contains('RecentFiles_Click')) {throw 'R9 modules not connected'}
          $updater=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs' -Raw
          if (!$updater.Contains('DeskSpaceUpdateProgress.Publish("Downloading"') -or !$updater.Contains('DeskSpaceUpdateProgress.Publish("Restarting"')) {throw 'R9 progress gates missing'}
          if (!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdateProgress.cs')) {throw 'R9 progress source missing'}

      - name: Apply R10 integrated twin donut and in-widget modules
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r10/apply-r10.ps1
          ./r10/apply-r10-tests.ps1
          ./r10/apply-r10-search-unify.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach($check in @('private DeskSpaceModuleV10? activeModule;', 'OpenInWidget(string name)', 'double scale=420.0/Width', 'private const double OpenDiameter = 408', 'DeskSpaceClipboardV10.Poll()', 'DeskSpaceWindowBehavior.AllowInput(this,true)')) {
            if(!$widget.Contains($check)){throw "R10 widget missing $check"}
          }
          if ($widget.Contains('case "Search": OpenSearch();')) { throw 'R10 search must not open a separate panel' }
          $modules=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceModuleV10.cs' -Raw
          foreach($module in @('BuildSearch(', 'BuildNotes(', 'BuildReminders(', 'BuildCalendar(', 'BuildClipboard(', 'BuildPassword(', 'BuildCalculator(')) {
            if(!$modules.Contains($module)){throw "R10 module missing $module"}
          }
          $vault=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceVaultV10.cs' -Raw
          foreach($gate in @('AesGcm', 'Pbkdf2', 'CryptographicOperations.ZeroMemory', 'File.Move(tmp, path, true)')) {
            if(!$vault.Contains($gate)){throw "R10 vault safety check missing $gate"}
          }
          $recurrence=Get-Content 'DeskSpace_Windows_R1/DeskSpace/Models.cs' -Raw
          if(!$recurrence.Contains('public string Recurrence')){throw 'R10 recurrence data not linked'}

      - name: Apply R11 inline widget views and weather scene
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r11/apply-r11.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach($required in @('new DeskSpaceSearchV11(', 'new DeskSpaceInlineV11(', 'Width=540;Height=72;', 'ResizeLiveSearch', 'ProcessStartInfo("calc.exe")', 'new DeskSpaceWeatherSceneV11(', 'AddWeatherScene(145,145,130)')) {
            if(!$widget.Contains($required)){throw "R11 widget behavior missing: $required"}
          }
          $module=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceModuleV10.cs' -Raw
          if($module.Contains('BuildCalculator(') -or $module.Contains('BuildSearch(body)')) {throw 'Legacy calculator or oversized Search popup remains'}
          if(!$module.Contains('internal static List<SearchHit> SearchNow(')){throw 'Shared Search engine not available'}
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchV11.cs' -Raw
          if(!$search.Contains('item.MouseEnter') -or $search.Contains('Windows Calculator')){throw 'R11 Search result hover actions not verified'}
          $inline=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceInlineV11.cs' -Raw
          foreach($required in @('BuildNotes(', 'BuildReminders(', 'BuildClipboard(')) {
            if(!$inline.Contains($required)){throw "R11 inline module missing $required"}
          }
          $scene=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceWeatherSceneV11.cs' -Raw
          foreach($required in @('Sunny(', 'Cloudy(', 'Rain(', 'Night(', 'StopMotion()')){
            if(!$scene.Contains($required)){throw "R11 weather scene missing $required"}
          }

      - name: Apply R12 weather rendering and explicit drag gestures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r12/apply-r12.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          foreach($required in @('OnShortcutRightMouseDown','StartShortcutDrag()','ModifierKeys.Shift','Mouse.RightButton==MouseButtonState.Pressed','rightClickOpenedUntil','SectorAt(e.GetPosition(this))>=0','Width=216,Height=116')) {
            if(!$widget.Contains($required)) {throw "R12 expected widget behavior missing: $required"}
          }
          if($widget.Contains('Leaving the outermost circle means MOVE WIDGET')) {throw 'R12 unwanted outside-ring drag still exists'}
          if($widget.Contains('move outside ring to drag')) {throw 'R12 obsolete drag tooltip remains'}
          $scene=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceWeatherSceneV11.cs' -Raw
          foreach($needed in @('TimeSpan.FromSeconds(18)','Motion(-d*.065,d*.075,5.2)','Motion(-d*.11,d*.14,1.6)')) {
            if(!$scene.Contains($needed)) {throw "R12 weather animation missing: $needed"}
          }

      - name: Apply R13 full-drive search and adaptive weather/widget corrections
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r13/apply-r13.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchIndexV13.cs' -Raw
          if(!$widget.Contains('ModuleArea()') -or !$widget.Contains('AddWeatherScene(53,6,185)')) { throw 'R13 adaptive size/weather gate missing' }
          if(!$search.Contains('DriveInfo.GetDrives()') -or !$search.Contains('Installed app / Start menu')) { throw 'R13 broad search/app gate missing' }
          if(!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchIndexV13.cs')) {throw 'R13 index missing'}
          $inline=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceInlineV11.cs' -Raw
          if(!$inline.Contains('MaxHeight=122') -or !$inline.Contains('MaxHeight=115')) {throw 'R13 inline-size gate missing'}

      - name: Apply R14 compact widget corrections
        shell: pwsh
        run: |
          ./r14/apply-r14.ps1
          $code=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          if(!$code.Contains('height<=58?CompactDiameter') -or !$code.Contains('without an extra plate')){throw 'R14 gates missing'}
          if(!(Test-Path 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceShellIconV14.cs')){throw 'R14 shell icons missing'}

      - name: Apply R15 weather, whole-PC discovery and drag-drop shelf
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r15/apply-r15.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          $shelf=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceDropShelfV15.cs' -Raw
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchIndexV13.cs' -Raw
          $weather=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceWeatherSceneV11.cs' -Raw
          if(!$widget.Contains('attachedShelf.Enable()')) {throw 'R15 shelf not attached to main widget'}
          $clipboard=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceClipboardV10.cs' -Raw
          if(!$clipboard.Contains('DeskSpaceDropShelfV15.ActivePaths')) {throw 'R15 Clipboard uses a separate shelf'}
          if(!$shelf.Contains('PreviewDrop+=Receive') -or !$shelf.Contains('DragDrop.DoDragDrop') -or !$shelf.Contains('File.Copy(source,destination,false)')) {throw 'R15 temporary file drag/copy paths missing'}
          if(!$search.Contains('ScanVolume(root)') -or !$search.Contains('RegistryKey.OpenBaseKey')) {throw 'R15 full-drive/app discovery not linked'}
          if(!$weather.Contains('nightAnimations') -or !$weather.Contains('moonGlow')) {throw 'R15 night motion missing'}

      - name: Apply R16 Excel exact-cell mapping and guarded autofill
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r16/apply-r16.ps1
          $ui=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceExcelV16.cs' -Raw
          $bridge=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceExcelBridgeV16.cs' -Raw
          $store=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceExcelStoreV16.cs' -Raw
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          if(!$ui.Contains('Capture selected Excel cells') -or !$ui.Contains('Preview matching cells')){throw 'Excel UI incomplete'}
          if(!$bridge.Contains('SaveCopyAs') -or !$bridge.Contains('Existing formula protected')){throw 'Safe Excel preview/backup missing'}
          if(!$store.Contains('CryptProtectData')){throw 'Excel mapping encryption missing'}
          if(!$widget.Contains('OpenInWidget("Excel")')){throw 'Excel module navigation missing'}
          $shelf=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceDropShelfV15.cs' -Raw
          if($shelf.Contains('if(effect==DragDropEffects.Copy)Remove(item);')){throw 'Premature file deletion still present'}

      - name: Add Excel cell-by-cell capture selection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r17/apply-r17.ps1
          $source=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceExcelV16.cs' -Raw
          foreach($required in @('selectedCells','SaveCheckedCells','CellReference','pendingSelection.Cells=chosen','Unchecked cells were excluded'))
          {
            if(!$source.Contains($required)) {throw "R17 selection gate missing: $required"}
          }

      - name: Apply R18 whole-system index and native Windows playback mode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r18/apply-r18.ps1
          $project=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj' -Raw
          $media=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceMediaV18.cs' -Raw
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchIndexV13.cs' -Raw
          $os=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceWindowsSearchV18.cs' -Raw
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          if(!$project.Contains('net8.0-windows10.0.19041.0')) {throw 'R18 Windows Runtime targeting missing'}
          if(!$media.Contains('GlobalSystemMediaTransportControlsSessionManager') -or !$widget.Contains('OnMediaVisibility')) {throw 'R18 media integration missing'}
          if(!$search.Contains('DeskSpaceWindowsSearchV18.Query') -or !$os.Contains('Search.CollatorDSO.1')) {throw 'R18 integrated Windows Search missing'}
          if(!$widget.Contains('LeaveMediaMode')){throw 'R18 widget cannot return to circle'}

      - name: Correct media controls below circle and search content spacing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r19/apply-r19.ps1
          $widget=Get-Content 'DeskSpace_Windows_R1/DeskSpace/WidgetHost.cs' -Raw
          $media=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceMediaV18.cs' -Raw
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchV11.cs' -Raw
          $shelf=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceDropShelfV15.cs' -Raw
          if($widget.Contains('Content=media.CreateView()')) {throw 'R19 still overrides the normal circle'}
          if(!$widget.Contains('media.ShowBelow(this,()=>content.Text)') -or !$widget.Contains('SetMediaOffset(218)')) {throw 'R19 controls or previous module data not wired'}
          if(!$media.Contains('Hide circle') -or !$media.Contains('TryChangePlaybackPositionAsync')) {throw 'R19 hide/seek controls missing'}
          if(!$search.Contains('80+Math.Min(260') -or !$search.Contains('var actions=new ContextMenu()')) {throw 'R19 results spacing or action menu missing'}
          if(!$shelf.Contains('public void SetMediaOffset(double offset)')) {throw 'R19 temporary shelf will overlap player'}

      - name: Apply R20 case-insensitive drive search and compact media redesign
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r20/apply-r20.ps1
          $index=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchIndexV13.cs' -Raw
          $media=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceMediaV18.cs' -Raw
          $search=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceSearchV11.cs' -Raw
          foreach($required in @('OrdinalIgnoreCase','VolumeCounts','driveFilter','showVolumes'))
          {if(!$index.Contains($required)){throw "R20 search coverage gate: $required"}}
          foreach($required in @('TogglePanel','ToggleCircle','DragDown','LoadArtAsync','IsShuffleEnabled','IsRepeatEnabled','IsPlaybackPositionEnabled','TryChangePlaybackRateAsync'))
          {if(!$media.Contains($required)){throw "R20 media gate: $required"}}
          if(!$search.Contains('DeskSpaceSearchIndexV13.Coverage')){throw 'R20 search coverage feedback missing'}

      - name: Apply R21 modern compact/expanded/pill player and search polish
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r21/apply-r21.ps1
