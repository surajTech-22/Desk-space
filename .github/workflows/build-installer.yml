      - name: Confirm installer and checksum exist
        shell: pwsh
        run: |
          if (!(Test-Path 'release/DeskSpace_Setup.exe')) { throw 'Installer not created' }
          if (!(Test-Path 'release/DeskSpace_Setup.sha256.txt')) { throw 'Checksum missing' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'release/DeskSpace_Setup.exe'))
          if ($bytes.Length -lt 5000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows installer' }

      - name: Package Update.exe bridge for existing manually updated PCs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='release/DeskSpace_Setup.exe'
          $checksum='release/DeskSpace_Setup.sha256.txt'
          if(!(Test-Path $exe) -or !(Test-Path $checksum)){throw 'Verified Setup files missing'}
          $expected=((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $expected){throw 'Original setup checksum mismatch'}
          Copy-Item -LiteralPath $exe -Destination 'release/Update.exe' -Force
          $copied=(Get-FileHash 'release/Update.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($copied -ne $expected){throw 'Update.exe is not identical to verified setup'}
          [IO.File]::WriteAllText('release/Update.sha256.txt',
            ($copied+'  Update.exe'+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))

      # Do not duplicate hundreds of MB of installer binaries in a
      # short-lived Actions artifact. The next verified step publishes
      # exactly these binaries and hashes to the canonical GitHub Release.
      - name: Verify release binaries before GitHub Release upload
        shell: pwsh
        run: |
          foreach($name in @('DeskSpace_Setup.exe',
              'DeskSpace_Setup.sha256.txt','Update.exe','Update.sha256.txt')){
            if(!(Test-Path "release/$name")){throw "Missing release asset $name"}
          }
          Write-Host 'Both Windows executables and checksum files are ready for GitHub Releases.'


      - name: Publish R42 stable automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/r42-excel-mapping-editor'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $currentHead=(gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/r42-excel-mapping-editor" --jq '.object.sha').Trim()
          if($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($currentHead)){
            throw 'Cannot verify current R42 branch head'
          }
          if($currentHead -ne $env:GITHUB_SHA){
            Write-Host 'Obsolete commit; verified release intentionally not published'
            exit 0
          }
          $exe = 'release/DeskSpace_Setup.exe'
          $checksum = 'release/DeskSpace_Setup.sha256.txt'
          if (!(Test-Path $exe) -or !(Test-Path $checksum)) { throw 'Installer and checksum required' }
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($digest -ne $expected) { throw 'Installer SHA256 mismatch' }
          $update='release/Update.exe'
          $updateChecksum='release/Update.sha256.txt'
          if(!(Test-Path $update) -or !(Test-Path $updateChecksum)){throw 'Update.exe bridge missing'}
          $copied=(Get-FileHash $update -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedUpdate=((Get-Content $updateChecksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if($copied -ne $digest -or $expectedUpdate -ne $digest){
            throw 'Update.exe SHA256 does not match trusted Setup.exe'
          }
          $versionLine = Select-String -Path 'installer/DeskSpace.iss' -Pattern '^#define AppVersion "([^"]+)"$' | Select-Object -First 1
          if (!$versionLine) { throw 'Installer version missing' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = 'v' + $version
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite stable release $tag" }
          # GitHub API occasionally returns a transient 500 even after all
          # Windows checks pass. Retry creation safely rather than withholding
          # a verified build on a temporary backend failure.
          $published=$false
          for($attempt=1;$attempt -le 4;$attempt++){
            gh release create $tag $exe $checksum $update $updateChecksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DeskSpace R42 automatic update $version" --notes "Stable DeskSpace R42 automatic-channel release from commit $env:GITHUB_SHA. Windows build, actual V36 widget and main Workspace WPF smoke tests, installer validation, and SHA-256 verification passed. Installs through the existing supervised updater."
            if($LASTEXITCODE -eq 0){$published=$true;break}
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if($LASTEXITCODE -eq 0){
              # May have been created by the failed attempt. Require all
              # four attached artifacts and identical trusted SHA256 digests.
              $assets=gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
              if($LASTEXITCODE -ne 0){throw 'Cannot inspect partially created release'}
              foreach($needed in @('DeskSpace_Setup.exe','DeskSpace_Setup.sha256.txt','Update.exe','Update.sha256.txt')){
                if($assets -notcontains $needed){throw "Partially created release $tag lacks $needed"}
              }
              $published=$true;break
            }
            if($attempt -lt 4){Start-Sleep -Seconds (3*$attempt)}
          }
          if(-not $published){throw 'Automatic stable release publication failed after retries'}
          Write-Host "Verified stable release: $tag"

      - name: Publish successful version to private GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'installer/DeskSpace.iss' -Pattern '^#define AppVersion "([^"]+)"$' | Select-Object -First 1
          if (!$match) { throw 'Cannot read compiled DeskSpace release version' }
          $tag = 'v' + $match.Matches[0].Groups[1].Value
          $repo = 'surajTech-22/Desk-space'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to replace existing tagged release $tag" }
          gh release create $tag 'release/DeskSpace_Setup.exe' 'release/DeskSpace_Setup.sha256.txt' --repo $repo --target $env:GITHUB_SHA --title 'DeskSpace R5 automatic updater' --notes 'Private verified Windows release. The DeskSpace updater authenticates using the official GitHub CLI.'
          if ($LASTEXITCODE -ne 0) { throw 'Automatic update release publishing failed' }
          $status = "$tag|$env:GITHUB_SHA|release-published"
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $receiptPath = "repos/$repo/contents/releases/latest-build.txt"
          # The file already exists after the first release. GitHub's contents API
          # requires its CURRENT blob SHA for every subsequent update.
          $oldSha = gh api $receiptPath --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($oldSha)) { throw 'Cannot verify current release receipt SHA' }
          $body = @{
            message='Record verified DeskSpace automatic-release publication'
            content=$base64
            branch='main'
            sha=$oldSha.Trim()
          }
          $request = $body | ConvertTo-Json -Compress
          $receiptFile = Join-Path $env:RUNNER_TEMP 'deskspace-release-receipt.json'
          [IO.File]::WriteAllText($receiptFile,$request,[Text.UTF8Encoding]::new($false))
          gh api --method PUT $receiptPath --input $receiptFile
          if ($LASTEXITCODE -ne 0) { throw 'Release published, but publication receipt could not be saved' }
