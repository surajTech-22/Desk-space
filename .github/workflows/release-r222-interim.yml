name: DeskSpace R222 interim release — both update channels
on:
  push:
    branches: [feat/r201-consolidated-roadmap-bundle]
    paths:
      - .github/workflows/release-r222-interim.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deskspace-r222-interim-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout exactly the authorized interim release recipe
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify R222 CI provenance and restore exact hashed source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='surajTech-22/Desk-space'
          $pass=gh api "repos/$repo/actions/runs/41028168373"
          if($LASTEXITCODE -ne 0){throw 'Cannot verify R222 Windows acceptance run'}
          $check=($pass|Out-String)|ConvertFrom-Json
          if($check.conclusion -ne 'success' -or
             $check.head_sha -ne '19948aa574072a49326506712723766d1aadbed1'){
             throw 'R222 canonical source was not successfully validated'
          }
          New-Item -ItemType Directory -Force '.release-r222/source'|Out-Null
          gh run download 41028168373 -R $repo -n DeskSpace-R221-Consolidated-Verified-Source -D '.release-r222/source'
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve verified R222 source'}
          & ./r221/verify-single-source.ps1 -ArchivePath '.release-r222/source/DeskSpace-R221-Source.zip' -ManifestPath '.release-r222/source/DeskSpace-R221-Source.manifest.json' -ReceiptPath '.release-r222/source/DeskSpace-R221-Source.sha256.txt'
          $m=Get-Content '.release-r222/source/DeskSpace-R221-Source.manifest.json' -Raw|ConvertFrom-Json
          if($m.commit -ne '19948aa574072a49326506712723766d1aadbed1'){
              throw 'R222 source provenance commit is different from accepted run'
          }
          New-Item -ItemType Directory -Force '.release-r222/base'|Out-Null
          gh run download 41002762293 -R $repo -n DeskSpace-R195-Canonical-WPF-Source -D '.release-r222/base'
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve verified installer tooling'}
          $expected=((Get-Content '.release-r222/base/DeskSpace-Canonical-Source.sha256.txt' -Raw).Trim() -split '\s+')[0]
          $actual=(Get-FileHash '.release-r222/base/DeskSpace-Canonical-Source.zip' -Algorithm SHA256).Hash
          if(!$actual.Equals($expected,[StringComparison]::OrdinalIgnoreCase)){
              throw 'Baseline installer build source checksum mismatch'
          }
          Expand-Archive '.release-r222/base/DeskSpace-Canonical-Source.zip' -DestinationPath '.release-r222/legacy'
          # The original model test project is required by the canonical
          # self-contained installer builder; it never reads user files.
          $parts=for($i=1;$i -le 4;$i++){
              (Get-Content -LiteralPath "assets/source.part$i.txt" -Raw).Trim()
          }
          $legacyTar='.release-r222/legacy-source.tar.xz'
          [IO.File]::WriteAllBytes(
              [IO.Path]::GetFullPath($legacyTar),[Convert]::FromBase64String($parts -join ''))
          $tarhash=(Get-FileHash $legacyTar -Algorithm SHA256).Hash.ToLowerInvariant()
          if($tarhash -ne 'de852a020013de604cdb9b206e38f4ec1359e7f2169bc898e9ca60299a0249a3'){
              throw 'Original model-test source checksum mismatch'
          }
          tar -xJf $legacyTar
          if($LASTEXITCODE -ne 0){throw 'Cannot restore original unit test sources'}
          if(!(Test-Path 'DeskSpace_Windows_R1/DeskSpace.Tests/DeskSpace.Tests.csproj')){
              throw 'DeskSpace original model tests not restored'
          }
          Remove-Item -LiteralPath 'DeskSpace_Windows_R1/DeskSpace' -Recurse -Force
          Expand-Archive '.release-r222/source/DeskSpace-R221-Source.zip' -DestinationPath '.release-r222/latest'
          Move-Item '.release-r222/latest/DeskSpace' 'DeskSpace_Windows_R1/DeskSpace'
          New-Item -ItemType Directory -Force 'installer'|Out-Null
          Copy-Item '.release-r222/legacy/installer/DeskSpace.iss' 'installer/DeskSpace.iss' -Force
          Copy-Item '.release-r222/legacy/BUILD_DESKSPACE_SETUP.ps1' 'BUILD_DESKSPACE_SETUP.ps1' -Force
          $code=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceVerifiedUpdateQueueV191.cs' -Raw
          if(!$code.Contains('NormalizeOfficialChecksumV219')){
              throw 'R219 updater checksum fix missing from verified source'
          }
          $atomic=Get-Content 'DeskSpace_Windows_R1/DeskSpace/DeskSpaceAtomicInstallerV222.cs' -Raw
          if(!$atomic.Contains('File.Move(partial,final,true)')){
              throw 'R222 atomic installer handoff missing from verified source'
          }
          Write-Host "R222 interim source is identical to Windows acceptance build, with immutable SHA256 evidence."
      - name: Assign upgrade version above previously published stable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='1.5.'+(1093+[int]$env:GITHUB_RUN_NUMBER)
          $stable=gh api 'repos/surajTech-22/Desk-space/releases/latest' --jq .tag_name
          if($LASTEXITCODE -ne 0){throw 'Cannot read existing Stable release'}
          if([version]$version -le [version](($stable|Out-String).Trim().TrimStart('v'))){
              throw 'New version would be a downgrade'
          }
          $setup='installer/DeskSpace.iss'
          $value=[IO.File]::ReadAllText($setup)
          $old='#define AppVersion "1.5.1093"'
          if(!$value.Contains($old)){throw 'Original installer version unexpected'}
          [IO.File]::WriteAllText($setup,$value.Replace($old,'#define AppVersion "'+$version+'"'),[Text.UTF8Encoding]::new($false))
          $updater='DeskSpace_Windows_R1/DeskSpace/DeskSpaceUpdater.cs'
          $s=[IO.File]::ReadAllText($updater)
          $old='private static readonly Version InstalledVersion = new(1, 5, 1093);'
          if(!$s.Contains($old)){throw 'Original updater version unexpected'}
          $s=$s.Replace($old,'private static readonly Version InstalledVersion = new(1, 5, '+(1093+[int]$env:GITHUB_RUN_NUMBER)+');')
          [IO.File]::WriteAllText($updater,$s,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('.release-r222/version.txt',$version,[Text.Encoding]::ASCII)
          Write-Host "Interim release candidate: $version"
      - name: Run isolated synthetic updater and WPF acceptance on shipping source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./r220/test-r220.ps1
          ./r213/test-r213.ps1
          foreach($script in @(
            'r201/apply-tests-r201-r202.ps1',
            'r203/apply-tests-r203.ps1',
            'r205/apply-tests-r205.ps1',
            'r206/apply-tests-r206.ps1',
            'r207/apply-tests-r207.ps1',
            'r208/apply-tests-r208.ps1',
            'r209/apply-tests-r209.ps1',
            'r210/apply-tests-r210.ps1',
            'r211/apply-tests-r211.ps1',
            'r212/apply-tests-r212.ps1',
            'r214/apply-tests-r214.ps1',
            'r215/apply-tests-r215.ps1',
            'r216/apply-tests-r216.ps1',
            'r217/apply-tests-r217.ps1',
            'r218/apply-tests-r218.ps1',
            'r219/apply-tests-r219.ps1',
            'r222/apply-tests-r222.ps1'
          )){ & $script }
          dotnet run --project 'r36/UiSmoke/UiSmoke.csproj' -c Release -- '--r201-only'
          if($LASTEXITCODE -ne 0){throw 'Interim release native WPF/updater tests failed'}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'Inno Setup not available'}
      - name: Build verified self-contained Windows installer
        shell: pwsh
        run: |
          ./BUILD_DESKSPACE_SETUP.ps1
          ./r220/normalize-release-checksum.ps1 -OutputDirectory release
          ./r220/test-r220.ps1
          $setup='release/DeskSpace_Setup.exe'
          $sha=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::Copy([IO.Path]::GetFullPath($setup),
              [IO.Path]::GetFullPath('release/Update.exe'),$true)
          [IO.File]::WriteAllText('release/Update.sha256.txt',$sha,[Text.Encoding]::ASCII)
          foreach($name in @('DeskSpace_Setup.exe','Update.exe')){
              $actual=(Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
              if($actual -ne $sha){throw 'The release binary bridge SHA256 diverged'}
          }
          if(([IO.File]::ReadAllBytes('release/DeskSpace_Setup.sha256.txt')).Length -ne 64){
              throw 'Older updater compatibility checksum length invalid'
          }
          Write-Host "R222 verified installer SHA256: $sha"
      - name: Prevent obsolete or changed-branch publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $current=gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/feat/r201-consolidated-roadmap-bundle" --jq '.object.sha'
          if($LASTEXITCODE -ne 0 -or ($current|Out-String).Trim() -ne $env:GITHUB_SHA){
              throw 'Interim release recipe has changed during the build; do not publish'
          }
      - name: Publish same verified installer to Tester and Stable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=Get-Content '.release-r222/version.txt' -Raw
          $version=$version.Trim()
          if($version -notmatch '^1\.5\.\d+$'){throw 'Invalid interim release version'}
          $repo='surajTech-22/Desk-space'
          $assets=@('release/DeskSpace_Setup.exe',
              'release/DeskSpace_Setup.sha256.txt','release/Update.exe',
              'release/Update.sha256.txt')
          foreach($entry in @(
              @{Tag='tester-v'+$version;Pre=$true},
              @{Tag='v'+$version;Pre=$false}
          )){
              $tag=$entry.Tag
              gh release view $tag -R $repo *> $null
              if($LASTEXITCODE -eq 0){throw "Refusing to overwrite release $tag"}
              $notes="Interim DeskSpace R201–R222 update requested 2026-10-30. Automated Windows acceptance, SHA-256 and synthetic rollback passed. Known limitations: physical mixed-DPI monitor tests, real Excel COM acceptance, code signing, and remaining roadmap are pending. Existing user data retained by updater."
              if($entry.Pre){
                  gh release create $tag @assets --prerelease -R $repo --target $env:GITHUB_SHA --title "DeskSpace $version interim tester update" --notes $notes
              }else{
                  gh release create $tag @assets -R $repo --target $env:GITHUB_SHA --title "DeskSpace $version interim stable update" --notes $notes
              }
              if($LASTEXITCODE -ne 0){throw "Failed to publish $tag"}
          }
          foreach($tag in @('tester-v'+$version,'v'+$version)){
              $release=((gh api "repos/$repo/releases/tags/$tag")|Out-String)|ConvertFrom-Json
              if($LASTEXITCODE -ne 0 -or $release.target_commitish -ne $env:GITHUB_SHA){
                  throw "Published release target SHA mismatch for $tag"
              }
              $local=(Get-FileHash 'release/DeskSpace_Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
              foreach($name in @('DeskSpace_Setup.exe','Update.exe')){
                  $asset=@($release.assets | Where-Object {$_.name -eq $name})
                  if($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:'+$local)){
                      throw "Published installer checksum mismatch for $tag : $name"
                  }
              }
          }
          Write-Host "Interim release SUCCESS: same SHA256 build on Tester and Stable."
      - name: Notify verified Stable and Tester clients
        shell: pwsh
        continue-on-error: true
        run: |
          ./r133/publish-r133.ps1
      - name: Record limited-scope release verdict
        if: always()
        shell: pwsh
        run: |
          Write-Host 'Interim release scope is R201-R222; final roadmap gate remains NOT READY.'
