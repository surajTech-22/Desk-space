name: R347 Search cache footprint and offline OCR privacy
on:
  push:
    branches:
      - fix/r347-search-cache-ocr-safety
    paths:
      - .github/workflows/test-r347-cache-ocr.yml
      - r344/**
      - r346/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staged DeskSpace code
        uses: actions/checkout@v4
      - name: Install .NET 8 for WPF
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reconstruct staging Windows source and compile both tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'DeskSpace_Windows_R1' | Out-Null
          Copy-Item -Path 'src/DeskSpace' -Destination 'DeskSpace_Windows_R1/DeskSpace' -Recurse -Force
          Copy-Item 'r344/DeskSpaceScreenTextV344.cs' 'DeskSpace_Windows_R1/DeskSpace/' -Force
          Copy-Item 'r346/DeskSpaceSearchDiskHealthV346.cs' 'DeskSpace_Windows_R1/DeskSpace/' -Force
          dotnet build 'DeskSpace_Windows_R1/DeskSpace/DeskSpace.csproj' -c Release
          if($LASTEXITCODE -ne 0){throw 'R347 native WPF compile failed'}
      - name: Run exact SQLite WAL and SHM regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet run --project 'r346/StableTests/SearchDiskHealthTests.csproj' -c Release
          if($LASTEXITCODE -ne 0){throw 'R347 SQLite sidecar regression failed'}
      - name: Verify OCR screenshot byte buffer erased even after exception
        shell: pwsh
        run: |
          $s=Get-Content 'r344/DeskSpaceScreenTextV344.cs' -Raw
          if($s -notmatch '(?s)byte\[\] image=CaptureRegion\(rectangle\.Value\);\s*try\s*\{.*?RecognizeAsync\(image,current\.Token\);\s*\}\s*finally\s*\{.*?Array\.Clear\(image,0,image\.Length\);'){
            throw 'R347 OCR capture buffer must be erased in finally after recognition'
          }
          Write-Host 'R347 PASS: screenshot bytes cleared on OCR completion, cancellation and failure.'
