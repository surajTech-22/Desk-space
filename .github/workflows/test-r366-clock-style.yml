name: DeskSpace R366 Idle Clock Native Windows Regression
on:
  push:
    branches: [fix/r366-background-activity-audit]
    paths:
      - src/DeskSpace/DeskSpaceWeatherContrastV64.cs
      - src/DeskSpace/WidgetHost.cs
      - r64/DeskSpaceWeatherContrastV64.cs
      - r366/Tests/**
      - .github/workflows/test-r366-clock-style.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile checked-in Windows DeskSpace source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build src/DeskSpace/DeskSpace.csproj -c Release --nologo
          if($LASTEXITCODE -ne 0){throw 'Checked-in DeskSpace WPF build failed'}
      - name: Check idle widget path avoids discarded clock effects
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $code=Get-Content src/DeskSpace/WidgetHost.cs -Raw
          $start=$code.IndexOf('    private void UpdateCenter()')
          $progress=$code.IndexOf('        if (progress.Active)', $start)
          $effect=$code.IndexOf('new System.Windows.Media.Effects.DropShadowEffect', $start)
          if($start -lt 0 -or $progress -lt 0 -or $effect -lt $progress){
              throw 'Idle widget still creates a weather effect before checking update progress'
          }
      - name: Verify identical clock palette and no idle resource churn
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet run --project r366/Tests/ClockStyleCacheTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'R366 clock visual regression failed'}
